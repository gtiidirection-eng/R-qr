name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: |
          npm install
          npm install qrcode-generator@1.4.4 --no-save

      - name: Copier les bibliothèques QR
        run: |
          mkdir -p www/lib
          cp node_modules/jsqr/dist/jsQR.js www/lib/jsQR.js
          QG=$(find node_modules/qrcode-generator -maxdepth 2 -name qrcode.js | head -1)
          echo "Fichier QR utilisé : $QG"
          cat > shim.js <<'EOF'

          window.QRCode = {
            toCanvas: function (canvas, text, opts, cb) {
              opts = opts || {};
              var qr = qrcode(0, 'M');
              qr.addData(text);
              qr.make();
              var n = qr.getModuleCount();
              var margin = opts.margin == null ? 2 : opts.margin;
              var size = opts.width || 260;
              var cell = Math.floor(size / (n + margin * 2)) || 1;
              var total = cell * (n + margin * 2);
              canvas.width = total;
              canvas.height = total;
              var c = canvas.getContext('2d');
              c.fillStyle = '#fff';
              c.fillRect(0, 0, total, total);
              c.fillStyle = '#000';
              for (var r = 0; r < n; r++) {
                for (var k = 0; k < n; k++) {
                  if (qr.isDark(r, k)) c.fillRect((k + margin) * cell, (r + margin) * cell, cell, cell);
                }
              }
              if (cb) cb();
            }
          };
          EOF
          cat "$QG" shim.js > www/lib/qrcode.js
          ls -la www/lib

      - name: Ajouter Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: presence-qr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
